[project]
name = "project-address-agent"
version = "0.1.0"
description = "Auditable ADK agent for repairing missing presale project locations."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk>=2.0,<3",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "truststore>=0.10,<1",
]

[dependency-groups]
dev = [
  "google-adk[eval]>=2.0,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
project-address-agent = "project_address_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project_address_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
