name: ETL 實價登錄

on:
  schedule:
    # 內政部每月 1、11、21 日發布新批次;UTC 20:00 = 台灣時間隔天(2、12、22 日)凌晨 4 點
    - cron: "0 20 1,11,21 * *"
  workflow_dispatch: # 手動補跑用

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # 北北桃三市:每旬增量約 30–60 分,留餘裕;首次全量回填請在本機跑(見 plan Phase 4 runbook)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 套用資料庫 migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 跑 ETL(下載 → 解析 → geocode → 統計)
        run: pnpm etl:all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # 契約建材設備表:需 poppler(pdftotext)與 playwright chromium;
      # 走真實瀏覽器故較慢,每旬限量增量,失敗與逾 30 天者自動重試(見 etl/fetch-contract-materials.ts)
      - name: 安裝 poppler(pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: 安裝 playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 抓契約建材設備表(增量)
        run: pnpm etl:contracts -- --limit 80
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
