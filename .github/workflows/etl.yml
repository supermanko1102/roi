name: ETL 實價登錄

on:
  schedule:
    # 每天台灣時間凌晨 4 點跑:MOI 每旬(1/11/21)才發布,但常遲發;
    # parse 的 isStaleBatch 防重 + run-all 短路讓空跑只花幾分鐘,遲發批次當天即補
    - cron: "0 20 * * *"
  workflow_dispatch: # 手動補跑用
    inputs:
      seasons:
        description: "額外回填的歷史季別(空白分隔,如 110S3 110S4;留空=只跑最新一期)"
        required: false
        default: ""
      contracts_limit:
        description: "契約建材抓取單次上限"
        required: false
        default: "80"

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # 北北桃三市:每旬增量約 30–60 分。歷史回填(seasons 輸入)首輪會對 NLSC
    # geocode 大量新門牌,可能跑數小時;進度存 geocode_cache,超時重跑即續傳。
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝 uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: project-address-agent/uv.lock

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 套用資料庫 migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 下載歷史季別(手動回填用)
        if: github.event.inputs.seasons != ''
        run: npx tsx etl/download-lvr.ts ${{ github.event.inputs.seasons }}

      - name: 跑 ETL(下載 → 解析 → geocode → 統計)
        run: pnpm etl:all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ETL_WORKFLOW: github-actions-${{ github.event_name }}

      # 契約建材設備表:需 poppler(pdftotext)與 playwright chromium;
      # 走真實瀏覽器故較慢,每旬限量增量,失敗與逾 30 天者自動重試(見 etl/fetch-contract-materials.ts)
      - name: 安裝 poppler(pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: 安裝 playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: 抓契約建材設備表(增量)
        run: pnpm etl:contracts -- --limit ${{ github.event.inputs.contracts_limit || '80' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
