name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roi
          POSTGRES_PASSWORD: roi
          POSTGRES_DB: taoyuan_roi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roi -d taoyuan_roi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://roi:roi@localhost:5432/taoyuan_roi_test
      TEST_DATABASE_URL: postgres://roi:roi@localhost:5432/taoyuan_roi_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安裝 uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: project-address-agent/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: uv run --project project-address-agent --locked pytest
      - run: pnpm build
